general {
    hide_cursor = false
}

animations {
    enabled = false
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrains Mono NF
    position = 30, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = Password for <span foreground="##50fa7b">$USER</span>:
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrains Mono NF
    position = 30, -58
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/system.sh
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrains Mono NF
    position = 30, 198
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/display.sh
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrains Mono NF
    position = 30, 170
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    color = rgb(255, 255, 255)
