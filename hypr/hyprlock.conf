    font_family = JetBrains Mono NF
    position = 30, 86
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/volume.sh
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrains Mono NF
