font=JetBrains Mono NF:pixelsize=10

pad=0x0
term=foot
dpi-aware=no
selection-target=both
include=~/.config/foot/theme.ini

[colors-dark]
alpha=0.85
foreground=ebeef9
background=07090d
regular0=1c1c1c  # black
regular1=ff3d5e  # red
regular2=14ff8a  # green
regular3=ffce63  # yellow
regular4=58b6ca  # blue
regular5=6488c4  # magenta
regular6=8d84c6  # cyan
regular7=d0d0fa  # white
bright0=838796   # bright black
bright1=ee829f   # bright red
bright2=a5ffe1   # bright green
bright3=f3e877   # bright yellow
bright4=8be9fd   # bright blue
bright5=97bbf7   # bright magenta
bright6=c0b7f9   # bright cyan
bright7=ffffff   # bright white

[colors-light]
alpha=0.8
foreground=101010
background=ffffff
cursor=ffffff 1a3d8f
regular0=ffffff  # black
regular1=ff0086  # red
regular2=00c918  # green
regular3=e8b022  # yellow
regular4=3777e6  # blue
regular5=ad00a1  # magenta
regular6=1faaaa  # cyan
regular7=101010  # white
bright0=b0b0b0   # bright black
bright1=ff0086   # bright red
bright2=00c918   # bright green
bright3=e8b022   # bright yellow
bright4=3777e6   # bright blue
bright5=ad00a1   # bright magenta
bright6=1faaaa   # bright cyan
bright7=202020   # bright white

[key-bindings]
search-start=Control+Shift+R

[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}
